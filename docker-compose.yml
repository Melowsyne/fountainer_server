services:
  server:
    build: .
    container_name: fountain_server
    ports:
      - "8443:8443"   # WebSocket protocol (v2.2)
      - "8080:8080"   # Firmware HTTP (OTA download)
      - "8010:8010"   # Admin web interface (login + RPC buttons)
    volumes:
      # Keep firmware images persistent / fillable from outside.
      - ./FIRMWARE_UPDATES:/app/FIRMWARE_UPDATES:rw
      # Device logs persistent (survive container rebuilds — before
      # 2026-08-23 they lived ONLY in the container and were lost on every build).
      - ./DEVICE_LOGS:/app/DEVICE_LOGS:rw
      # Device registry (device_id -> bearer token + auth keys).
      - ./devices.json:/app/devices.json:ro
      # Testbed PKI (read-only): server certificate/key + root CA for mTLS.
      # The firmware is provisioned for wss:// with a client certificate —
      # WITHOUT this mount + the TLS_* variables below the server rejects every
      # connection attempt of the ESP32 with HTTP 400 (incident 2026-07-24).
      - ../DO_NOT_COMMIT/CA:/ca:ro
    environment:
      - FOUNTAIN_WS_HOST=0.0.0.0
      - FOUNTAIN_WS_PORT=8443
      - FOUNTAIN_HTTP_HOST=0.0.0.0
      - FOUNTAIN_HTTP_PORT=8080
      # Publicly reachable address -> ends up in the OTA firmware URLs.
      - FOUNTAIN_PUBLIC_HOST=${FOUNTAIN_PUBLIC_HOST:-192.168.1.12}
      - FOUNTAIN_PUBLIC_PORT=${FOUNTAIN_PUBLIC_PORT:-8080}
      - FOUNTAIN_OTA_MANDATORY=${FOUNTAIN_OTA_MANDATORY:-0}
      - FOUNTAIN_LOG=${FOUNTAIN_LOG:-INFO}
      # Admin web interface
      - FOUNTAIN_WEB_PORT=8010
      - FOUNTAIN_ADMIN_USER=${FOUNTAIN_ADMIN_USER:-admin}
      - FOUNTAIN_ADMIN_PASSWORD=${FOUNTAIN_ADMIN_PASSWORD:-admin}
      # TLS (wss:// + mTLS) — paths point into the PKI mount above. The
      # key passphrase comes from the git-ignored .env file
      # (TLS_KEY_PASSWORD=...), never put it in here.
      - TLS_CERT=${TLS_CERT:-/ca/server/server.crt.pem}
      - TLS_KEY=${TLS_KEY:-/ca/server/server.key.pem}
      - TLS_CLIENT_CA=${TLS_CLIENT_CA:-/ca/root/certs/ca.crt.pem}
      - TLS_KEY_PASSWORD=${TLS_KEY_PASSWORD:-}
    restart: unless-stopped
